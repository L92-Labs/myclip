name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  audit:
    name: Source audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Formatting, modules, notices and workflow lint
        run: |
          test -z "$(gofmt -l .)"
          go mod verify
          python3 scripts/licenses.py --check
          for script in scripts/*.sh; do bash -n "$script"; done
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -color
      - name: Scan full history for secrets
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --no-banner --log-opts=--all .
      - name: Check reachable Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/release.py --check-tag "$RELEASE_TAG"
          git merge-base --is-ancestor HEAD origin/main

  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Linux native libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0t64 libgl1 libegl1 libfontconfig1 libfreetype6
      - name: Vet and tests without cgo
        run: scripts/test.sh -count=1
      - name: Race detector
        run: go test -race -count=1 ./...

  build:
    name: Build (${{ matrix.target }})
    needs: [audit, tests]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux/amd64
            arch: amd64
            artifact: linux-amd64
          - os: ubuntu-24.04
            target: linux/arm64
            arch: arm64
            artifact: linux-arm64
          - os: macos-15
            target: darwin/universal
            arch: universal
            artifact: macos-universal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Build Linux installers
        if: runner.os == 'Linux'
        env:
          TARGET_ARCH: ${{ matrix.arch }}
        run: scripts/build-linux.sh --skip-tests --arch "$TARGET_ARCH"
      - name: Build macOS universal installers
        if: runner.os == 'macOS'
        run: scripts/build-mac.sh --skip-tests --universal --dmg
      - name: Verify and collect release packages
        env:
          TARGET: ${{ matrix.target }}
        run: python3 scripts/release.py "$TARGET"
      - name: Install Linux smoke tools
        if: matrix.target == 'linux/amd64'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0t64 libgl1 libegl1 libayatana-appindicator3-1 libxtst6 xvfb openbox scrot xdotool tesseract-ocr
      - name: Smoke test packaged Linux app
        if: matrix.target == 'linux/amd64'
        run: |
          set -o pipefail
          mkdir -p build/smoke
          MYCLIP_SMOKE_BINARY="$PWD/build/linux-amd64/myclip" MYCLIP_SMOKE_EVIDENCE_DIR="$PWD/build/smoke" scripts/linux-smoke.sh 2>&1 | tee build/smoke/test.log
      - name: Upload smoke evidence
        if: always() && matrix.target == 'linux/amd64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-smoke-evidence
          path: build/smoke/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.artifact }}
          path: build/release/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish prerelease
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [audit, tests, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: build/release
          merge-multiple: true
      - name: Checksums
        run: python3 scripts/release.py --checksums
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: build/release/*
      - name: Create draft, upload complete artifact set, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease --title "MyClip $RELEASE_TAG (preview)" --notes-file docs/RELEASE_NOTES.md build/release/*
          gh release edit "$RELEASE_TAG" --draft=false
